<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>系统激活 — 成绩核算系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #0891b2;
      --accent: #2dd4bf;
      --bg: #f0fdfa;
      --text: #134e4a;
    }
    body {
      background: linear-gradient(180deg, #f0fdfa 0%, #ecfeff 40%, #f0f9ff 100%);
      background-attachment: fixed;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .activation-card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(45,212,191,0.2);
      border-radius: 1.2rem;
      box-shadow: 0 10px 30px rgba(8,145,178,0.12);
      max-width: 480px;
      width: 100%;
      padding: 2.5rem;
    }
    .icon-circle {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #0891b2, #2dd4bf);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.2rem;
      font-size: 1.6rem; color: #fff;
    }
    .machine-id-box {
      background: #f0fdfa;
      border: 1px dashed #2dd4bf;
      border-radius: 0.6rem;
      padding: 0.8rem 1rem;
      font-family: "Cascadia Code", "Consolas", monospace;
      font-size: 0.95rem;
      word-break: break-all;
      user-select: all;
      cursor: pointer;
    }
    .btn-activate {
      background: linear-gradient(135deg, #0891b2, #2dd4bf);
      border: none;
      color: #fff;
      font-weight: 600;
      padding: 0.65rem 1.5rem;
      border-radius: 0.6rem;
      transition: all 0.2s;
    }
    .btn-activate:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(8,145,178,0.25);
      color: #fff;
    }
    .btn-copy {
      background: transparent;
      border: 1px solid #2dd4bf;
      color: #0891b2;
      font-size: 0.85rem;
      padding: 0.3rem 0.8rem;
      border-radius: 0.5rem;
    }
    .btn-copy:hover {
      background: #ccfbf1;
      color: #0e7490;
    }
  </style>
</head>
<body>
  <div class="activation-card">
    <div class="icon-circle">
      <i class="bi bi-shield-lock"></i>
    </div>
    <h5 class="text-center fw-bold mb-1">系统激活</h5>
    <p class="text-center text-muted small mb-4">请将机器码发送给管理员，获取激活码后输入</p>

    {% if error %}
    <div class="alert alert-danger py-2 small" role="alert">
      <i class="bi bi-exclamation-circle me-1"></i>{{ error }}
    </div>
    {% endif %}

    <div class="mb-3">
      <label class="form-label small fw-semibold">
        <i class="bi bi-pc-display me-1"></i>本机机器码
      </label>
      <div class="d-flex gap-2 align-items-center">
        <div class="machine-id-box flex-grow-1" id="machineId">{{ machine_id or '无法获取' }}</div>
        <button class="btn btn-copy" onclick="copyId()">
          <i class="bi bi-clipboard me-1"></i>复制
        </button>
      </div>
      <div class="form-text">点击复制后发送给管理员</div>
    </div>

    <form method="POST" action="/activate">
      <div class="mb-3">
        <label for="code" class="form-label small fw-semibold">
          <i class="bi bi-key me-1"></i>激活码
        </label>
        <input type="text" class="form-control" id="code" name="code"
               placeholder="V1-XXXX-XXXXXXXX-XXXXXXXX" required autofocus
               style="font-family: monospace; letter-spacing: 0.05em;">
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-activate">
          <i class="bi bi-unlock me-1"></i>激活
        </button>
      </div>
    </form>

    <p class="text-center text-muted small mt-3 mb-0">
      成绩核算系统 v2
    </p>
  </div>

  <script>
    function copyId() {
      const text = document.getElementById('machineId').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.btn-copy');
        btn.innerHTML = '<i class="bi bi-check me-1"></i>已复制';
        setTimeout(() => btn.innerHTML = '<i class="bi bi-clipboard me-1"></i>复制', 1500);
      });
    }
  </script>
</body>
</html>
