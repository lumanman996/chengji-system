<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}成绩核算系统{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}">
</head>
<body>
<nav class="navbar navbar-expand-md">
  <div class="container-fluid px-4">
    <a href="{{ url_for('index') }}" class="navbar-brand d-flex align-items-center gap-2">
      <i class="bi bi-water"></i>
      <span>成绩核算系统</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navContent">
      <ul class="navbar-nav ms-auto gap-1">
        <li class="nav-item">
          <a href="{{ url_for('index') }}" class="nav-link"><i class="bi bi-house me-1"></i>首页</a>
        </li>
        <li class="nav-item">
          <a href="{{ url_for('config_page') }}" class="nav-link"><i class="bi bi-gear me-1"></i>配置管理</a>
        </li>
        <li class="nav-item">
          <a href="{{ url_for('algo_page') }}" class="nav-link"><i class="bi bi-sliders me-1"></i>算法参数</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="wave-divider" aria-hidden="true">
  <svg viewBox="0 0 1200 32" preserveAspectRatio="none">
    <path d="M0,16 C150,32 350,0 600,16 C850,32 1050,0 1200,16 L1200,0 L0,0 Z" fill="#2dd4bf" opacity="0.08"/>
  </svg>
</div>

<main class="container-fluid px-4 py-4">
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for msg in messages %}
        <div class="alert alert-warning alert-dismissible fade show shadow-sm" role="alert">
          <i class="bi bi-exclamation-triangle me-2"></i>{{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

<footer class="text-center small py-3 mt-auto">
  成绩核算系统 v2
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
